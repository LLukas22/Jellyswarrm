name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install Rust from rust-toolchain.toml
      run: rustup show active-toolchain

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: build

    - name: Install just
      uses: extractions/setup-just@v4
      with:
        just-version: '1.59.0'

    # Exercise a fresh checkout before installing Node or generating static/.
    - name: Test UI build validation
      run: python3 scripts/test-ui-build.py

    - name: Check Rust without UI assets
      run: cargo check --locked --workspace --all-targets --all-features

    - name: Run tests without UI assets
      run: cargo test --locked --workspace --verbose

    - name: Setup Node.js (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Build embedded UI
      run: just ui

    - name: Check client HTTP route inventory
      run: node scripts/scan-client-routes.cjs --check

    - name: Build
      run: cargo build --locked --workspace --verbose

    - name: Lint (clippy)
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    - name: Format check
      run: cargo fmt --all -- --check

  dependencies:
    name: Dependency advisories and licenses
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        # Abandoned transitive crates are reported, but security findings fail.
        command: check --warn unmaintained advisories bans licenses sources
        arguments: --locked

  integration:
    name: Docker integration test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Checkout media fixtures
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        lfs: true
        submodules: recursive

    - name: Install Rust from rust-toolchain.toml
      run: rustup show active-toolchain

    - name: Cache Rust artifacts
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: integration

    - name: Install just
      uses: extractions/setup-just@v4
      with:
        just-version: '1.59.0'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ui/package-lock.json

    - name: Build embedded UI
      run: just ui

    - name: Verify Docker Compose
      run: docker compose version

    - name: Run integration test
      run: just integration-test

    - name: Run containerized browser integration test
      run: just browser-integration-test-docker

    - name: Upload browser videos, traces and failure screenshots
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-artifacts
        path: target/browser-test-artifacts/
        if-no-files-found: ignore
        retention-days: 7
