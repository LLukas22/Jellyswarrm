[workspace]
members = ["crates/jellyswarrm-proxy", "crates/jellyswarrm-macros", "crates/jellyfin-api",
]
resolver = "2"

[workspace.package]
authors = ["lukaskreussel@gmail.com"]
edition = "2021"
rust-version = "1.99"
repository = "https://github.com/LLukas22/Jellyswarrm"
version = "1.0.0"

[workspace.dependencies]

# Runtime and utilities
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.42", features = ["serde"] }
config = "0.15.19"
futures-util = "0.3.31"
mime_guess = "2.0.5"
moka = { version = "0.12.12", features = ["future"] }
percent-encoding = "2.3.2"
rand = "0.9.5"
regex = "1.12.2"
rust-embed = "8.9.0"
thiserror = "2.0.17"
time = "0.3.55"
tokio = { version = "1.54.1" }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.19.0", features = ["v4", "serde"] }

# Web and UI
askama = "0.14.0"
axum = { version = "0.8.8", features = ["macros"] }
axum-login = "0.18.0"
axum-messages = "0.8.0"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", default-features = false }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls-native-roots"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tower-sessions = { version = "0.14.0", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }

# Data and serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_plain = "1.0.2"
serde_urlencoded = "0.7.1"
serde_with = "3.16.1"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
toml = "0.9.8"

# Cryptography
aes-gcm = "0.10.3"
argon2 = "0.5"
base64 = "0.22.1"
hex = "0.4.3"
hkdf = "0.12.4"
sha1 = "0.10.6"
sha2 = "0.10.9"

# Logging and tracing
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }

# Proc-macro implementation
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full", "extra-traits"] }

# Workspace crates
jellyfin-api = { path = "crates/jellyfin-api" }
jellyswarrm-macros = { path = "crates/jellyswarrm-macros" }

# Development and tests
tempfile = "3.23.0"
testcontainers = { version = "0.27.3", features = ["docker-compose"] }
tokio-tungstenite = "0.28.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
redundant_clone = "warn"

# Preserve the existing size-oriented settings until benchmarks justify a change.
[profile.release]
strip = true
opt-level = "z"
lto = true
