[package]
name = "jellyswarrm-proxy"
version = { workspace = true }
edition = { workspace = true }
rust-version.workspace = true
publish = false
authors = { workspace = true }
repository = { workspace = true }
description = "A high-performance reverse proxy for combining multiple Jellyfin instances"
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[features]
browser-tests = ["dep:playwright-rs"]

[dependencies]
aes-gcm = { workspace = true }
anyhow = { workspace = true }
argon2 = { workspace = true }
askama = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["ws"] }
axum-login = { workspace = true }
axum-messages = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
jellyfin-api = { workspace = true }
jellyswarrm-macros = { workspace = true }
mime_guess = { workspace = true }
moka = { workspace = true }
percent-encoding = { workspace = true }
playwright-rs = { version = "0.20.1", optional = true, default-features = false, features = ["rustls-tls-native-roots", "ring"] }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true }
tower-sessions-sqlx-store = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
testcontainers = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
