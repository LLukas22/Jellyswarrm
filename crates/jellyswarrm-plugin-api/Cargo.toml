[package]
name = "jellyswarrm-plugin-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
authors.workspace = true
license = "MIT OR Apache-2.0"
repository.workspace = true
description = "Contract between Jellyswarrm and its compile-time plugins"

[lints]
workspace = true

[features]
# An in-memory `Host` for plugin tests: `testing::TestHost`.
testing = []

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jellyswarrm-plugin-api = { path = ".", features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
