# Include optional browser-test dependencies and platform-specific dependencies.
[graph]
all-features = true

# Vulnerabilities and unsoundness fail by default; every ignore below needs a
# reason and an exit condition. CI and `just audit` report unmaintained
# transitive crates as warnings: several have no fixed release and replacing
# their parents is separate migration work.
[advisories]
ignore = [
    # Bundled SQLite < 3.54 can leak page-cache memory when opening a database
    # together with a crafted `-wal` file of a different page size. Jellyswarrm
    # only opens the database it creates in its own data directory; anyone who
    # can plant files there already controls the instance. The fix needs
    # libsqlite3-sys >= 0.39, which no released sqlx (0.8.6 / 0.9.0) allows.
    # Remove once sqlx ships with `libsqlite3-sys < 0.40` (already on sqlx main).
    { id = "RUSTSEC-2026-0459", reason = "local-only; only our own data-dir DB is opened; blocked on a sqlx release" },
]

# This audits dependency metadata; it does not change the project's licenses.
[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
